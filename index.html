<title>Snacky | Snacky</title>
<style>
:root { --bg: #F7F7F2; --surface: #FFFFFF; --text: #16213E; --text2: #56607A; --text3: #8C95A8; --line: rgba(22,33,62,0.1); --accent: #2E8F78; }
@media (prefers-color-scheme: dark) { :root { --bg: #11172A; --surface: #1A2238; --text: #EEF0F6; --text2: #B4BACB; --text3: #8A92A8; --line: rgba(255,255,255,0.12); --accent: #6FD3BA; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; line-height: 1.8; -webkit-text-size-adjust: 100%; }
main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
.brand { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: var(--accent); text-decoration: none; }
h1 { font-size: 26px; line-height: 1.4; margin: 6px 0 24px; }
h2 { font-size: 17px; margin: 32px 0 8px; }
p, li { font-size: 15px; color: var(--text2); }
ol { padding-left: 1.4em; margin: 0; }
li { margin: 4px 0; }
a { color: var(--accent); }
.table { overflow-x: auto; margin: 8px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--text2); line-height: 1.6; }
th { color: var(--text); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.cards { display: grid; gap: 12px; }
.card { display: block; padding: 18px 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-weight: 700; font-size: 16px; }
.card span { display: block; font-weight: 400; font-size: 13px; color: var(--text3); margin-top: 2px; }
footer { margin-top: 48px; font-size: 12px; color: var(--text3); }
</style>
